grid_search:
  class: GridSearchCV
  module: sklearn.model_selection
  params:
    cv: 3
    verbose: 2

model_selection:
  module_0:
    class: RandomForestClassifier
    module: sklearn.ensemble
    params:
      n_estimators: 200
      min_samples_split: 7
      min_samples_leaf: 6
      max_depth: 10
      criterion: entropy
      random_state: 101
    search_param_grid:
      n_estimators:
        - 100
        - 200
        - 300
      min_samples_split:
        - 2
        - 4
        - 7
      max_depth:
        - 5
        - 10
        - 15